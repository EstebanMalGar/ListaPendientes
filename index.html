<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lista de Pendientes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2c4a52">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pendientes">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --paper:#e8e1d0;
    --paper-2:#ded5bf;
    --card:#f5f0e4;
    --ink:#2b2621;
    --ink-soft:#5a5145;
    --line:#c3b89e;
    --navy:#2c4a52;
    --navy-ink:#eef2f0;
    --rust:#a63d2f;
    --ochre:#a97a1f;
    --sage:#4f6f52;
    --shadow: 2px 3px 0 rgba(43,38,33,0.12);
    color-scheme: light;
  }
  :root:not([data-theme="light"]) @media-noop{}
  * { box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--paper);
    background-image:
      linear-gradient(var(--paper-2) 1px, transparent 1px);
    background-size: 100% 34px;
    color: var(--ink);
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, "Courier New", monospace;
    min-height: 100vh;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#20211d;
      --paper-2:#2a2b25;
      --card:#282922;
      --ink:#ece6d6;
      --ink-soft:#b7ae98;
      --line:#454637;
      --navy-ink:#eef2f0;
      --shadow: 2px 3px 0 rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"]{
    --paper:#20211d;
    --paper-2:#2a2b25;
    --card:#282922;
    --ink:#ece6d6;
    --ink-soft:#b7ae98;
    --line:#454637;
    --navy-ink:#eef2f0;
    --shadow: 2px 3px 0 rgba(0,0,0,0.35);
  }

  .app{
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }

  header.top{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    border-bottom: 3px solid var(--ink);
    padding-bottom: 14px;
    margin-bottom: 22px;
    flex-wrap: wrap;
  }
  header.top h1{
    font-family:Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
    font-weight: 600;
    font-size: clamp(28px, 4vw, 40px);
    margin: 0;
    letter-spacing: -0.01em;
  }
  header.top .tag{
    font-size: 12px;
    color: var(--ink-soft);
    border: 1px solid var(--line);
    padding: 4px 10px;
    border-radius: 3px;
    white-space: nowrap;
  }

  .layout{
    display:grid;
    grid-template-columns: 240px 1fr;
    gap: 24px;
  }
  @media (max-width: 820px){
    .layout{ grid-template-columns: 1fr; }
  }

  /* GROUP TABS / DRAWER LIST */
  .groups{
    display:flex;
    flex-direction: column;
    gap: 0;
  }
  .groups h2{
    font-family:Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
    font-size: 13px;
    font-weight:500;
    color: var(--ink-soft);
    margin: 0 0 10px 2px;
  }
  .group-tab{
    display:flex;
    align-items:center;
    gap:10px;
    width:100%;
    text-align:left;
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 6px solid var(--tab-color, var(--navy));
    padding: 10px 12px;
    margin-bottom: 8px;
    border-radius: 2px;
    cursor:pointer;
    font-family:ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, "Courier New", monospace;
    color: var(--ink);
    font-size: 14px;
    box-shadow: var(--shadow);
    transition: transform .12s ease;
  }
  .group-tab:hover{ transform: translateX(2px); }
  .group-tab.active{
    background: var(--tab-color, var(--navy));
    color: var(--navy-ink);
    border-color: var(--tab-color, var(--navy));
  }
  .group-tab .gname{ flex:1; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .group-tab .gcount{
    font-size: 11px;
    opacity: .8;
    font-variant-numeric: tabular-nums;
  }
  .group-actions{
    display:flex;
    gap: 2px;
    flex: 0 0 auto;
  }
  .group-actions button{
    background: none;
    border: none;
    color: inherit;
    opacity: .6;
    cursor: pointer;
    font-size: 13px;
    padding: 2px 4px;
    line-height: 1;
    border-radius: 2px;
  }
  .group-actions button:hover{ opacity: 1; background: rgba(0,0,0,0.08); }

  .new-group{
    display:flex;
    gap:6px;
    margin-top: 6px;
  }
  .new-group input{
    flex:1;
    min-width:0;
  }

  @media (max-width: 820px){
    .groups{
      flex-direction: row;
      flex-wrap: nowrap;
      overflow-x: auto;
      padding-bottom: 4px;
      gap: 8px;
    }
    .groups h2{ display:none; }
    .group-tab{
      margin-bottom:0;
      flex: 0 0 auto;
      border-left-width: 4px;
      white-space: nowrap;
    }
    .new-group{ flex:0 0 auto; }
    .new-group input{ width: 140px; }
  }

  /* MAIN PANEL */
  main{ min-width:0; }

  .group-header{
    display:flex;
    align-items:center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .group-header h2{
    font-family:Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
    font-size: 24px;
    font-weight: 600;
    margin: 0;
    border-bottom: 3px solid var(--group-color, var(--navy));
    padding-bottom: 2px;
  }
  .group-stats{
    font-size: 12px;
    color: var(--ink-soft);
  }

  .filters{
    display:flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .filters button{
    font-family:ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, "Courier New", monospace;
    font-size: 12px;
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    padding: 6px 10px;
    border-radius: 3px;
    cursor: pointer;
  }
  .filters button.active{
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }

  .add-task{
    display:flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .add-task input[type=text]{
    flex: 1 1 260px;
  }
  select, input[type=text]{
    font-family:ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, "Courier New", monospace;
    font-size: 14px;
    padding: 9px 10px;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--card);
    color: var(--ink);
  }
  select{ cursor:pointer; }
  button.primary{
    font-family:ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, "Courier New", monospace;
    font-size: 14px;
    font-weight: 600;
    background: var(--ink);
    color: var(--paper);
    border: none;
    padding: 9px 16px;
    border-radius: 3px;
    cursor: pointer;
  }
  button.primary:active{ transform: translateY(1px); }
  button.ghost{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--ink-soft);
    font-family:ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, "Courier New", monospace;
    font-size: 13px;
    padding: 8px 12px;
    border-radius: 3px;
    cursor:pointer;
  }

  .section-label{
    font-family:Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
    font-size: 14px;
    color: var(--ink-soft);
    margin: 22px 0 8px;
    display:flex;
    align-items:center;
    gap: 8px;
  }
  .section-label::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--line);
  }

  ul.tasks{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }

  li.task{
    display:flex;
    align-items:flex-start;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 2px;
    padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  li.task.done{
    opacity: .62;
  }
  .check{
    width: 20px;
    height: 20px;
    border: 2px solid var(--ink);
    border-radius: 3px;
    flex: 0 0 20px;
    margin-top: 2px;
    cursor: pointer;
    position: relative;
    background: transparent;
  }
  li.task.done .check{
    background: var(--ink);
  }
  li.task.done .check::after{
    content:"";
    position:absolute;
    left: 5px; top: 1px;
    width: 5px; height: 10px;
    border: solid var(--paper);
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }
  .task-body{ flex:1; min-width:0; }
  .task-text{
    font-size: 14.5px;
    line-height: 1.5;
    word-break: break-word;
  }
  li.task.done .task-text{
    text-decoration: line-through;
    text-decoration-thickness: 1.5px;
    color: var(--ink-soft);
  }
  .task-meta{
    display:flex;
    align-items:center;
    gap: 8px;
    margin-top: 6px;
  }
  .stamp{
    font-family:ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, "Courier New", monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 2px 7px;
    border-radius: 2px;
    border: 1.5px solid currentColor;
    transform: rotate(-2deg);
    display:inline-block;
  }
  .stamp.alta{ color: var(--rust); }
  .stamp.media{ color: var(--ochre); }
  .stamp.baja{ color: var(--sage); }
  .task-date{ font-size: 11px; color: var(--ink-soft); }

  .remove{
    background:none;
    border:none;
    color: var(--ink-soft);
    cursor:pointer;
    font-size: 16px;
    line-height:1;
    padding: 2px 4px;
    flex: 0 0 auto;
  }
  .remove:hover{ color: var(--rust); }

  .empty{
    padding: 30px 10px;
    text-align:center;
    color: var(--ink-soft);
    font-size: 14px;
    border: 1px dashed var(--line);
    border-radius: 4px;
  }

  /* MODAL */
  .modal-overlay{
    position: fixed;
    inset: 0;
    background: rgba(20,18,14,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 100;
  }
  .modal-overlay.hidden{ display:none; }
  .modal-box{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    box-shadow: var(--shadow);
    padding: 20px;
    max-width: 360px;
    width: 100%;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", "Segoe UI Mono", Consolas, "Courier New", monospace;
    color: var(--ink);
  }
  .modal-box h3{
    font-family:Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;
    font-size: 18px;
    margin: 0 0 10px;
  }
  .modal-box p{
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height: 1.5;
    margin: 0 0 14px;
  }
  .modal-box input[type=text]{
    width: 100%;
    margin-bottom: 14px;
  }
  .modal-actions{
    display:flex;
    justify-content: flex-end;
    gap: 8px;
  }

  ::selection{ background: var(--navy); color: var(--navy-ink); }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Lista de Pendientes</h1>
    <span class="tag" id="totalTag">0 pendientes</span>
    <span class="tag" id="syncTag">Conectando…</span>
  </header>

  <div class="layout">
    <nav class="groups" id="groupsNav">
      <h2>Conjuntos</h2>
      <div id="groupList"></div>
      <form class="new-group" id="newGroupForm">
        <input type="text" id="newGroupInput" placeholder="Nuevo conjunto…" maxlength="40">
        <button type="submit" class="ghost">+</button>
      </form>
    </nav>

    <main>
      <div class="group-header">
        <h2 id="groupTitle">—</h2>
        <span class="group-stats" id="groupStats"></span>
      </div>

      <form class="add-task" id="addTaskForm">
        <input type="text" id="taskInput" placeholder="Escribe una tarea nueva…" maxlength="200">
        <select id="prioritySelect">
          <option value="alta">Alta</option>
          <option value="media" selected>Media</option>
          <option value="baja">Baja</option>
        </select>
        <button type="submit" class="primary">Agregar</button>
      </form>

      <div class="filters">
        <button data-filter="todas" class="active">Todas</button>
        <button data-filter="pendientes">Pendientes</button>
        <button data-filter="realizadas">Realizadas</button>
      </div>

      <div id="taskLists"></div>
    </main>
  </div>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-box" id="modalBox">
    <h3 id="modalTitle"></h3>
    <p id="modalMessage"></p>
    <input type="text" id="modalInput" style="display:none;">
    <div class="modal-actions">
      <button type="button" class="ghost" id="modalCancel">Cancelar</button>
      <button type="button" class="primary" id="modalConfirm">Aceptar</button>
    </div>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = "fichero-tareas-v1";
  const PALETTE = ["#2c4a52","#a63d2f","#a97a1f","#4f6f52","#5b4a72","#3d5a80"];
  const PRIORITY_ORDER = { alta: 0, media: 1, baja: 2 };
  const PRIORITY_LABEL = { alta: "Alta", media: "Media", baja: "Baja" };

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  // --- Custom modal (replaces window.confirm/prompt/alert, which don't work in this sandbox) ---
  const modalOverlay = document.getElementById("modalOverlay");
  const modalTitle = document.getElementById("modalTitle");
  const modalMessage = document.getElementById("modalMessage");
  const modalInput = document.getElementById("modalInput");
  const modalCancel = document.getElementById("modalCancel");
  const modalConfirm = document.getElementById("modalConfirm");
  let modalResolve = null;

  function closeModal(result){
    modalOverlay.classList.add("hidden");
    if(modalResolve){ modalResolve(result); modalResolve = null; }
  }
  modalCancel.addEventListener("click", () => closeModal(false));
  modalOverlay.addEventListener("click", (e) => { if(e.target === modalOverlay) closeModal(false); });
  modalConfirm.addEventListener("click", () => {
    if(modalInput.style.display !== "none"){
      closeModal(modalInput.value);
    } else {
      closeModal(true);
    }
  });
  modalInput.addEventListener("keydown", (e) => {
    if(e.key === "Enter"){ e.preventDefault(); closeModal(modalInput.value); }
    if(e.key === "Escape"){ e.preventDefault(); closeModal(false); }
  });

  function showConfirm(title, message){
    return new Promise((resolve) => {
      modalResolve = resolve;
      modalTitle.textContent = title;
      modalMessage.textContent = message;
      modalMessage.style.display = "block";
      modalInput.style.display = "none";
      modalConfirm.textContent = "Aceptar";
      modalCancel.style.display = "inline-block";
      modalOverlay.classList.remove("hidden");
    });
  }

  function showPrompt(title, message, defaultValue){
    return new Promise((resolve) => {
      modalResolve = resolve;
      modalTitle.textContent = title;
      modalMessage.textContent = message || "";
      modalMessage.style.display = message ? "block" : "none";
      modalInput.style.display = "block";
      modalInput.value = defaultValue || "";
      modalConfirm.textContent = "Guardar";
      modalCancel.style.display = "inline-block";
      modalOverlay.classList.remove("hidden");
      setTimeout(() => { modalInput.focus(); modalInput.select(); }, 30);
    });
  }

  function showAlert(title, message){
    return new Promise((resolve) => {
      modalResolve = resolve;
      modalTitle.textContent = title;
      modalMessage.textContent = message;
      modalMessage.style.display = "block";
      modalInput.style.display = "none";
      modalConfirm.textContent = "Entendido";
      modalCancel.style.display = "none";
      modalOverlay.classList.remove("hidden");
    });
  }

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && Array.isArray(parsed.groups)){
          if(!parsed._synced) parsed._synced = { groups: {}, tasks: {} };
          return parsed;
        }
      }
    }catch(e){ console.error("No se pudo leer el almacenamiento:", e); }
    const defaultGroupId = uid();
    return {
      groups: [{ id: defaultGroupId, name: "General", color: PALETTE[0], updatedAt: Date.now() }],
      tasks: [],
      activeGroup: defaultGroupId,
      filter: "todas",
      _synced: { groups: {}, tasks: {} }
    };
  }

  function saveState(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){ console.error("No se pudo guardar el almacenamiento:", e); }
  }

  let state = loadState();
  if(!state.activeGroup || !state.groups.find(g => g.id === state.activeGroup)){
    state.activeGroup = state.groups[0] ? state.groups[0].id : null;
  }
  if(!state.filter) state.filter = "todas";

  const groupListEl = document.getElementById("groupList");
  const groupTitleEl = document.getElementById("groupTitle");
  const groupStatsEl = document.getElementById("groupStats");
  const taskListsEl = document.getElementById("taskLists");
  const totalTagEl = document.getElementById("totalTag");
  const newGroupForm = document.getElementById("newGroupForm");
  const newGroupInput = document.getElementById("newGroupInput");
  const addTaskForm = document.getElementById("addTaskForm");
  const taskInput = document.getElementById("taskInput");
  const prioritySelect = document.getElementById("prioritySelect");
  const filterButtons = document.querySelectorAll(".filters button");
  const syncTagEl = document.getElementById("syncTag");

  // --- Cloud sync (works only when opened via the claude.ai artifact link, with network) ---
  let db = null;

  function setSyncStatus(text){
    if(syncTagEl) syncTagEl.textContent = text;
  }

  function pushToRemote(collectionName, item){
    if(!db) return;
    const { id, ...rest } = item;
    db.collection(collectionName).doc(id).set(rest)
      .then(() => { state._synced[collectionName][id] = true; })
      .catch((err) => console.error("Error al sincronizar " + collectionName + ":", err));
  }

  function deleteFromRemote(collectionName, id){
    if(!db) return;
    delete state._synced[collectionName][id];
    db.collection(collectionName).doc(id).delete()
      .catch((err) => console.error("Error al borrar en la nube:", err));
  }

  function mergeCollection(name, docs){
    const localArr = name === "groups" ? state.groups : state.tasks;
    const syncedMap = state._synced[name];
    const remoteIds = new Set();
    let changed = false;

    docs.forEach(docSnap => {
      if(!docSnap.exists) return;
      const id = docSnap.id;
      const data = docSnap.data();
      remoteIds.add(id);
      const local = localArr.find(x => x.id === id);
      if(!local){
        localArr.push(Object.assign({ id }, data));
        changed = true;
      } else if((data.updatedAt || 0) > (local.updatedAt || 0)){
        Object.assign(local, data);
        changed = true;
      }
      syncedMap[id] = true;
    });

    for(let i = localArr.length - 1; i >= 0; i--){
      const item = localArr[i];
      if(remoteIds.has(item.id)) continue;
      if(syncedMap[item.id]){
        // Existía en la nube y ya no está: se borró desde otro dispositivo.
        localArr.splice(i, 1);
        delete syncedMap[item.id];
        changed = true;
      } else {
        // Nunca se sincronizó (creada sin conexión): la subimos ahora.
        pushToRemote(name, item);
      }
    }

    if(changed){
      saveState();
      render();
    }
  }

  async function initSync(){
    if(typeof window.claude === "undefined" || typeof window.claude.use !== "function"){
      setSyncStatus("Guardado en este dispositivo");
      return;
    }
    try{
      db = await window.claude.use("db");
    }catch(e){
      db = null;
    }
    if(!db){
      setSyncStatus("Sin conexión con la nube");
      return;
    }
    setSyncStatus("Sincronizado");
    db.collection("groups").onSnapshot(
      (snap) => mergeCollection("groups", snap.docs),
      () => setSyncStatus("Error de sincronización")
    );
    db.collection("tasks").onSnapshot(
      (snap) => mergeCollection("tasks", snap.docs),
      () => setSyncStatus("Error de sincronización")
    );
  }

  function fmtDate(iso){
    const d = new Date(iso);
    const datePart = d.toLocaleDateString("es-ES", { day:"2-digit", month:"short" });
    const timePart = d.toLocaleTimeString("es-ES", { hour:"2-digit", minute:"2-digit" });
    return datePart + " · " + timePart;
  }

  function render(){
    // groups
    groupListEl.innerHTML = "";
    state.groups.forEach(g => {
      const count = state.tasks.filter(t => t.groupId === g.id && !t.done).length;
      const btn = document.createElement("div");
      btn.className = "group-tab" + (g.id === state.activeGroup ? " active" : "");
      btn.style.setProperty("--tab-color", g.color);
      btn.innerHTML = '<span class="gname"></span><span class="gcount"></span><span class="group-actions"><button type="button" class="rename-btn" aria-label="Renombrar conjunto" title="Renombrar">&#9998;</button><button type="button" class="delete-btn" aria-label="Eliminar conjunto" title="Eliminar">&times;</button></span>';
      btn.querySelector(".gname").textContent = g.name;
      btn.querySelector(".gcount").textContent = count;
      btn.querySelector(".gname").addEventListener("click", () => {
        state.activeGroup = g.id;
        saveState();
        render();
      });
      btn.querySelector(".gcount").addEventListener("click", () => {
        state.activeGroup = g.id;
        saveState();
        render();
      });
      btn.querySelector(".rename-btn").addEventListener("click", async (ev) => {
        ev.stopPropagation();
        const newName = await showPrompt("Renombrar conjunto", "", g.name);
        if(newName && newName.trim()){
          g.name = newName.trim().slice(0, 40);
          g.updatedAt = Date.now();
          pushToRemote("groups", g);
          saveState();
          render();
        }
      });
      btn.querySelector(".delete-btn").addEventListener("click", async (ev) => {
        ev.stopPropagation();
        if(state.groups.length <= 1){
          await showAlert("No es posible", "Debe quedar al menos un conjunto.");
          return;
        }
        const groupTasks = state.tasks.filter(t => t.groupId === g.id);
        const taskCount = groupTasks.length;
        const msg = taskCount > 0
          ? 'Eliminar "' + g.name + '" también borrará sus ' + taskCount + (taskCount === 1 ? " tarea" : " tareas") + ", incluidas las realizadas."
          : 'Eliminar el conjunto "' + g.name + '".';
        const ok = await showConfirm("Eliminar conjunto", msg);
        if(ok){
          groupTasks.forEach(t => deleteFromRemote("tasks", t.id));
          deleteFromRemote("groups", g.id);
          state.groups = state.groups.filter(x => x.id !== g.id);
          state.tasks = state.tasks.filter(t => t.groupId !== g.id);
          if(state.activeGroup === g.id){
            state.activeGroup = state.groups[0] ? state.groups[0].id : null;
          }
          saveState();
          render();
        }
      });
      groupListEl.appendChild(btn);
    });

    const activeGroup = state.groups.find(g => g.id === state.activeGroup);
    const totalPending = state.tasks.filter(t => !t.done).length;
    totalTagEl.textContent = totalPending + (totalPending === 1 ? " pendiente" : " pendientes") + " en total";

    if(!activeGroup){
      groupTitleEl.textContent = "Crea un conjunto para empezar";
      groupStatsEl.textContent = "";
      taskListsEl.innerHTML = "";
      return;
    }

    groupTitleEl.textContent = activeGroup.name;
    groupTitleEl.style.setProperty("--group-color", activeGroup.color);

    const groupTasks = state.tasks.filter(t => t.groupId === activeGroup.id);
    const pending = groupTasks.filter(t => !t.done).sort((a,b) => PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority] || a.createdAt - b.createdAt);
    const done = groupTasks.filter(t => t.done).sort((a,b) => (b.doneAt||0) - (a.doneAt||0));

    groupStatsEl.textContent = pending.length + " por hacer · " + done.length + " realizadas";

    filterButtons.forEach(b => b.classList.toggle("active", b.dataset.filter === state.filter));

    taskListsEl.innerHTML = "";

    function buildList(label, items){
      if(items.length === 0) return null;
      const wrap = document.createElement("div");
      const lbl = document.createElement("div");
      lbl.className = "section-label";
      lbl.textContent = label;
      const ul = document.createElement("ul");
      ul.className = "tasks";
      items.forEach(t => ul.appendChild(buildTaskEl(t)));
      wrap.appendChild(lbl);
      wrap.appendChild(ul);
      return wrap;
    }

    let showedAny = false;
    if(state.filter === "todas" || state.filter === "pendientes"){
      const block = buildList("Por hacer", pending);
      if(block){ taskListsEl.appendChild(block); showedAny = true; }
    }
    if(state.filter === "todas" || state.filter === "realizadas"){
      const block = buildList("Realizadas", done);
      if(block){ taskListsEl.appendChild(block); showedAny = true; }
    }

    if(!showedAny){
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = groupTasks.length === 0
        ? "Este conjunto todavía no tiene tareas. Agrega la primera arriba."
        : "No hay tareas que coincidan con este filtro.";
      taskListsEl.appendChild(empty);
    }
  }

  function buildTaskEl(t){
    const li = document.createElement("li");
    li.className = "task" + (t.done ? " done" : "");

    const check = document.createElement("button");
    check.className = "check";
    check.setAttribute("aria-label", t.done ? "Marcar como pendiente" : "Marcar como realizada");
    check.addEventListener("click", () => {
      t.done = !t.done;
      t.doneAt = t.done ? Date.now() : null;
      t.updatedAt = Date.now();
      pushToRemote("tasks", t);
      saveState();
      render();
    });

    const body = document.createElement("div");
    body.className = "task-body";

    const text = document.createElement("div");
    text.className = "task-text";
    text.textContent = t.text;

    const meta = document.createElement("div");
    meta.className = "task-meta";
    const stamp = document.createElement("span");
    stamp.className = "stamp " + t.priority;
    stamp.textContent = PRIORITY_LABEL[t.priority];
    const date = document.createElement("span");
    date.className = "task-date";
    date.textContent = t.done ? ("Hecha " + fmtDate(t.doneAt)) : ("Creada " + fmtDate(t.createdAt));

    meta.appendChild(stamp);
    meta.appendChild(date);
    body.appendChild(text);
    body.appendChild(meta);

    const remove = document.createElement("button");
    remove.className = "remove";
    remove.setAttribute("aria-label", "Eliminar tarea");
    remove.innerHTML = "&times;";
    remove.title = "Eliminar (permanente)";
    remove.addEventListener("click", async () => {
      const ok = await showConfirm("Eliminar tarea", "¿Eliminar esta tarea de forma permanente? Si solo la completaste, mejor usa la casilla.");
      if(ok){
        deleteFromRemote("tasks", t.id);
        state.tasks = state.tasks.filter(x => x.id !== t.id);
        saveState();
        render();
      }
    });

    li.appendChild(check);
    li.appendChild(body);
    li.appendChild(remove);
    return li;
  }

  newGroupForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = newGroupInput.value.trim();
    if(!name) return;
    const color = PALETTE[state.groups.length % PALETTE.length];
    const g = { id: uid(), name, color, updatedAt: Date.now() };
    state.groups.push(g);
    state.activeGroup = g.id;
    pushToRemote("groups", g);
    newGroupInput.value = "";
    saveState();
    render();
  });

  addTaskForm.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = taskInput.value.trim();
    if(!text || !state.activeGroup) return;
    const t = {
      id: uid(),
      groupId: state.activeGroup,
      text,
      priority: prioritySelect.value,
      done: false,
      createdAt: Date.now(),
      doneAt: null,
      updatedAt: Date.now()
    };
    state.tasks.push(t);
    pushToRemote("tasks", t);
    taskInput.value = "";
    saveState();
    render();
    taskInput.focus();
  });

  filterButtons.forEach(btn => {
    btn.addEventListener("click", () => {
      state.filter = btn.dataset.filter;
      saveState();
      render();
    });
  });

  render();
  initSync();

  if("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
})();
</script>
</body>
</html>
